[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrockimagelab"
version = "0.1.0"
description = "Browser app and tools for core and outcrop image processing, data collection, and automated geological and geomorphic classification and analysis"
readme = "README-pypi.md"
authors = [{name = "Larry Syu-Heng Lai"}]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "opencv-python>=4.5",
    "Pillow>=8.3",
    "matplotlib>=3.5",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.13"]
test = ["pytest", "httpx"]

[project.urls]
Homepage = "https://www.larrysyuhenglai.com/projects/pyRockImageLab/"
Repository = "https://github.com/GeoLarryLai/pyRockImageLab.git"

[project.scripts]
pyrockimagelab = "pyrockimagelab.core_box.processing:main"
pyrockimagelab-app = "pyrockimagelab.webapp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrockimagelab*"]

[tool.setuptools.package-data]
"pyrockimagelab.webapp" = ["static/*", "shell/static/*"]
